name: Prepare Runtime Inspector v2 Git objects

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  prepare:
    if: github.event.issue.title == 'runtime-inspector-v2-payload-de216564' && github.event.comment.body == 'CREATE_VALIDATED_COMMIT_OBJECT_DEBUG'
    name: Validate and create commit object
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Assemble and verify source payload
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          echo assemble > /tmp/preparation-phase
          gh api "/repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments?per_page=100" \
            --jq '. as $comments | [5195901919,5196145210,5195923173,5195969099,5196049061,5196056644,5196064206,5196070580] | map(. as $id | ($comments[] | select(.id == $id) | .body | ltrimstr("PAYLOAD:"))) | join("")' \
            > /tmp/runtime-inspector-v2.b64
          base64 --decode /tmp/runtime-inspector-v2.b64 > /tmp/runtime-inspector-v2.tar.gz
          echo 'de216564474293d57c18f30b018eb59583db1b34dfa0241e84d84b3943bd6243  /tmp/runtime-inspector-v2.tar.gz' | sha256sum --check

      - name: Restore v1 baseline and apply v2 files
        shell: bash
        run: |
          echo apply > /tmp/preparation-phase
          git checkout --detach 6654dbd6ae94123cbc9cf29d7bf9da8232d48e66
          tar -xzf /tmp/runtime-inspector-v2.tar.gz
          python <<'PY'
          from pathlib import Path

          path = Path('src/integration-inspector.ts')
          source = path.read_text()
          source = source.replace(
              "  function isPrivacySafePropertyName(value: string): boolean {\n    const controlCharacters = /[\\u0000-\\u001f\\u007f]/;\n    const emailAddress = /@/;\n",
              "  function isPrivacySafePropertyName(value: string): boolean {\n    const hasControlCharacters = Array.from(value).some(character => {\n      const codePoint = character.codePointAt(0);\n      return codePoint !== undefined && (codePoint <= 0x1f || codePoint === 0x7f);\n    });\n    const emailAddress = /@/;\n",
          )
          source = source.replace(
              '      !controlCharacters.test(value) &&',
              '      !hasControlCharacters &&',
          )
          path.write_text(source)
          PY

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Format repository
        run: pnpm format

      - name: Validate repository
        shell: bash
        run: |
          echo validate > /tmp/preparation-phase
          set -o pipefail
          pnpm validate 2>&1 | tee /tmp/validate.log

      - name: Create validated Git tree and commit objects
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          echo create-tree > /tmp/preparation-phase
          git add -A
          BASE_COMMIT=6654dbd6ae94123cbc9cf29d7bf9da8232d48e66
          BASE_TREE=$(git rev-parse "${BASE_COMMIT}^{tree}")
          export BASE_TREE
          python <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          base_commit = '6654dbd6ae94123cbc9cf29d7bf9da8232d48e66'
          output = subprocess.check_output(
              ['git', 'diff', '--cached', '--name-status', base_commit],
              text=True,
          )
          entries = []
          for raw_line in output.splitlines():
              fields = raw_line.split('\t')
              status = fields[0]
              path = fields[-1]
              if status.startswith('D'):
                  entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': None})
              else:
                  entries.append({
                      'path': path,
                      'mode': '100644',
                      'type': 'blob',
                      'content': Path(path).read_text(),
                  })
          Path('/tmp/tree.json').write_text(json.dumps({
              'base_tree': os.environ['BASE_TREE'],
              'tree': entries,
          }))
          PY
          wc -c /tmp/tree.json > /tmp/object.log
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/git/trees" --input /tmp/tree.json > /tmp/tree-response.json 2>> /tmp/object.log
          TREE_SHA=$(python -c "import json; print(json.load(open('/tmp/tree-response.json'))['sha'])")
          echo create-commit > /tmp/preparation-phase
          python - "$TREE_SHA" <<'PY'
          import json
          import sys
          from pathlib import Path

          Path('/tmp/commit.json').write_text(json.dumps({
              'message': 'feat: add read-only runtime integration inspection',
              'tree': sys.argv[1],
              'parents': ['6654dbd6ae94123cbc9cf29d7bf9da8232d48e66'],
          }))
          PY
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/git/commits" --input /tmp/commit.json > /tmp/commit-response.json 2>> /tmp/object.log
          COMMIT_SHA=$(python -c "import json; print(json.load(open('/tmp/commit-response.json'))['sha'])")
          gh issue comment "$ISSUE_NUMBER" --body "VALIDATED_COMMIT_OBJECT commit=${COMMIT_SHA} tree=${TREE_SHA}"

      - name: Report failure diagnostics
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          PHASE=$(cat /tmp/preparation-phase 2>/dev/null || echo setup)
          {
            echo "OBJECT_CREATION_FAILURE phase=${PHASE}"
            if [[ -f /tmp/object.log ]]; then
              echo
              echo '```text'
              tail -n 100 /tmp/object.log
              echo '```'
            fi
            if [[ -f /tmp/validate.log ]]; then
              echo
              echo 'Validation tail:'
              echo '```text'
              tail -n 30 /tmp/validate.log
              echo '```'
            fi
          } > /tmp/object-diagnostic.md
          gh issue comment "$ISSUE_NUMBER" --body-file /tmp/object-diagnostic.md
