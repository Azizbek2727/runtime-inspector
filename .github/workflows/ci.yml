name: Prepare validated Runtime Inspector v2 tree

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  prepare:
    if: github.event.issue.title == 'runtime-inspector-v2-payload-de216564' && github.event.comment.body == 'PREPARE_VALIDATED_TREE'
    name: Format, validate, and publish candidate branch
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Assemble and verify source payload
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          echo assemble > /tmp/publication-phase
          gh api "/repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments?per_page=100" \
            --jq '. as $comments | [5195901919,5196145210,5195923173,5195969099,5196049061,5196056644,5196064206,5196070580] | map(. as $id | ($comments[] | select(.id == $id) | .body | ltrimstr("PAYLOAD:"))) | join("")' \
            > /tmp/runtime-inspector-v2.b64
          base64 --decode /tmp/runtime-inspector-v2.b64 > /tmp/runtime-inspector-v2.tar.gz
          echo 'de216564474293d57c18f30b018eb59583db1b34dfa0241e84d84b3943bd6243  /tmp/runtime-inspector-v2.tar.gz' | sha256sum --check

      - name: Restore v1 baseline and apply v2 files
        shell: bash
        run: |
          echo apply > /tmp/publication-phase
          git checkout --detach 6654dbd6ae94123cbc9cf29d7bf9da8232d48e66
          tar -xzf /tmp/runtime-inspector-v2.tar.gz
          python <<'PY'
          from pathlib import Path

          path = Path('src/integration-inspector.ts')
          source = path.read_text()
          source = source.replace(
              "  function isPrivacySafePropertyName(value: string): boolean {\n    const controlCharacters = /[\\u0000-\\u001f\\u007f]/;\n    const emailAddress = /@/;\n",
              "  function isPrivacySafePropertyName(value: string): boolean {\n    const hasControlCharacters = Array.from(value).some(character => {\n      const codePoint = character.codePointAt(0);\n      return codePoint !== undefined && (codePoint <= 0x1f || codePoint === 0x7f);\n    });\n    const emailAddress = /@/;\n",
          )
          source = source.replace(
              '      !controlCharacters.test(value) &&',
              '      !hasControlCharacters &&',
          )
          path.write_text(source)
          PY

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Format repository
        run: pnpm format

      - name: Validate repository
        shell: bash
        run: |
          echo validate > /tmp/publication-phase
          set -o pipefail
          pnpm validate 2>&1 | tee /tmp/validate.log

      - name: Publish validated candidate tree
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          echo publish-candidate > /tmp/publication-phase
          git checkout 6654dbd6ae94123cbc9cf29d7bf9da8232d48e66 -- .github/workflows/ci.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add read-only runtime integration inspection'
          COMMIT_SHA=$(git rev-parse HEAD)
          TREE_SHA=$(git rev-parse HEAD^{tree})
          git push --force origin HEAD:refs/heads/agent/runtime-inspector-v2-validated
          gh issue comment "$ISSUE_NUMBER" --body "VALIDATED_TREE commit=${COMMIT_SHA} tree=${TREE_SHA}"

      - name: Report failure diagnostics
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          PHASE=$(cat /tmp/publication-phase 2>/dev/null || echo setup)
          {
            echo "PREPARATION_FAILURE phase=${PHASE}"
            if [[ -f /tmp/validate.log ]]; then
              echo
              echo '```text'
              tail -n 100 /tmp/validate.log
              echo '```'
            fi
          } > /tmp/preparation-diagnostic.md
          gh issue comment "$ISSUE_NUMBER" --body-file /tmp/preparation-diagnostic.md
