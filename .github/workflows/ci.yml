name: Apply Runtime Inspector v2 payload

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  apply:
    if: github.event.issue.title == 'runtime-inspector-v2-payload-de216564' && github.event.comment.body == 'APPLY'
    name: Format, validate, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Assemble source payload
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          echo assemble > /tmp/publication-phase
          gh api "/repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments?per_page=100" \
            --jq '. as $comments | [5195901919,5196145210,5195923173,5195969099,5196049061,5196056644,5196064206,5196070580] | map(. as $id | ($comments[] | select(.id == $id) | .body | ltrimstr("PAYLOAD:"))) | join("")' \
            > /tmp/runtime-inspector-v2.b64
          base64 --decode /tmp/runtime-inspector-v2.b64 > /tmp/runtime-inspector-v2.tar.gz

      - name: Verify source payload
        run: |
          echo verify > /tmp/publication-phase
          echo 'de216564474293d57c18f30b018eb59583db1b34dfa0241e84d84b3943bd6243  /tmp/runtime-inspector-v2.tar.gz' | sha256sum --check

      - name: Restore v1 baseline and apply v2 files
        shell: bash
        run: |
          echo apply > /tmp/publication-phase
          git checkout --detach 6654dbd6ae94123cbc9cf29d7bf9da8232d48e66
          tar -xzf /tmp/runtime-inspector-v2.tar.gz

      - name: Install locked dependencies
        run: |
          echo install > /tmp/publication-phase
          pnpm install --frozen-lockfile

      - name: Format repository
        run: |
          echo format > /tmp/publication-phase
          pnpm format

      - name: Validate repository
        shell: bash
        run: |
          echo validate > /tmp/publication-phase
          set -o pipefail
          pnpm validate 2>&1 | tee /tmp/validate.log

      - name: Publish atomic v2 commit
        shell: bash
        run: |
          echo publish > /tmp/publication-phase
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add read-only runtime integration inspection'
          git push --force origin HEAD:main

      - name: Close payload issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue close "$ISSUE_NUMBER" --reason completed

      - name: Report failure diagnostics
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          PHASE=$(cat /tmp/publication-phase 2>/dev/null || echo setup)
          B64_SIZE=$(wc -c < /tmp/runtime-inspector-v2.b64 2>/dev/null || echo unavailable)
          TAR_SIZE=$(wc -c < /tmp/runtime-inspector-v2.tar.gz 2>/dev/null || echo unavailable)
          SHA=$(sha256sum /tmp/runtime-inspector-v2.tar.gz 2>/dev/null | cut -d' ' -f1 || echo unavailable)
          {
            echo "PUBLICATION_FAILURE phase=${PHASE} b64_size=${B64_SIZE} tar_size=${TAR_SIZE} sha256=${SHA}"
            if [[ -f /tmp/validate.log ]]; then
              echo
              echo '```text'
              tail -n 100 /tmp/validate.log
              echo '```'
            fi
          } > /tmp/publication-diagnostic.md
          gh issue comment "$ISSUE_NUMBER" --body-file /tmp/publication-diagnostic.md
